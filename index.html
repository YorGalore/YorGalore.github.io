<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Components Demo</title>
    <script src="counter-display.js" defer></script>
    <script src="counter-controls.js" defer></script>
    <script src="combined-counter.js" defer></script>
    <script src="counter-display-b.js" defer></script>
    <script src="counter-controls-b.js" defer></script>
    <script src="combined-counter-b.js" defer></script>
    <script src="nama-nim.js" defer></script>


<style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .section {
      margin-bottom: 30px;
      padding: 15px;
      border: 2px solid #ccc;
    }
    .section-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .section-description {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 12px;
    }
    .demo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background-color: #fafafa;
    }
</style>
</head>

<body>
    <main>
        <div class="section">
        <div class="section-title">Nama & NIM</div>
        <div class="demo-container">
            <nama-nim></nama-nim>
        </div>
        </div>

        <div class="section">
            <h2>Komponen 1 & 2 - Separated</h2>
            <div class="demo-container vertical">
                <counter-display id="display" title="Counter" value="00"></counter-display>
                <counter-controls id="controls"></counter-controls>
            </div>
        </div>

        <div class="section">
            <h2>Komponen 3 - Combined Counter</h2>
            <div class="demo-container">
                <combined-counter title="Combined" value="00"></combined-counter>
            </div>
        </div>

        <div class="section">
            <h2>Multiple Counter</h2>
            <div class="grid-demo">
                <combined-counter title="Counter A" value="0"></combined-counter>
                <combined-counter title="Counter B" value="25"></combined-counter>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2025 Counter Components Demo YorGalore</p>
    </footer>

    <script>
        const display = document.getElementById('display');
        const controls = document.getElementById('controls');
        controls.addEventListener('count-change', e => {
            display.count += e.detail.delta;
        });
    </script>
</body>
</html>
